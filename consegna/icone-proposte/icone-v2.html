<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8"><title>Icona FisioAgenda verde acqua</title>
<style>
body{margin:0;background:#f4f6f9;font:15px/1.4 Inter,sans-serif;color:#13283f}
.sheet{width:1100px;padding:36px 40px;box-sizing:border-box}
h1{font:800 28px 'Inter Display',Inter,sans-serif;margin:0 0 4px} .sub{color:#5a677a;margin:0 0 26px}
.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px}
.card{box-sizing:border-box;min-width:0;background:#fff;border:1px solid #d7dee8;border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:16px;align-items:center;position:relative}
.num{position:absolute;top:14px;left:16px;width:32px;height:32px;border-radius:50%;background:#13283f;color:#fff;font-weight:800;display:grid;place-items:center}
.big svg{width:220px;height:220px;filter:drop-shadow(0 6px 14px rgba(19,40,63,.25))}
.name{font:700 19px Inter} .desc{color:#5a677a;font-size:13.5px;text-align:center}
.home{width:100%;box-sizing:border-box;border-radius:14px;background:linear-gradient(160deg,#3a6db5,#7aa7dd 60%,#b9d3f0);padding:16px 10px 12px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px;justify-items:center}
.home i{width:56px;height:56px;border-radius:14px;background:rgba(255,255,255,.5);display:block}
.home .app{display:flex;flex-direction:column;align-items:center;gap:4px;color:#fff;font-size:11px;font-weight:600}
.home .app svg{width:56px;height:56px}
.tab{width:100%;box-sizing:border-box;display:flex;align-items:center;gap:8px;background:#dfe3e9;border-radius:10px;padding:8px 10px;font-size:12.5px}
.tab span{background:#fff;border-radius:7px 7px 0 0;padding:5px 10px;display:flex;gap:6px;align-items:center} .tab svg{width:16px;height:16px}
</style></head><body><div class="sheet">
<h1>Icona FisioAgenda: verde acqua con la F</h1>
<p class="sub">Due modi di mettere la F nella proposta 3. Scegli A oppure B.</p>
<div class="row" id="row"></div></div>
<template id="A"><!-- A · calendario con la F al centro -->
<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="gA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2cc4b4"/><stop offset="1" stop-color="#0b7d84"/></linearGradient></defs>
<rect width="512" height="512" rx="114" fill="url(#gA)"/>
<rect x="96" y="120" width="320" height="304" rx="46" fill="#fff"/>
<path d="M96 166a46 46 0 0 1 46-46h228a46 46 0 0 1 46 46v34H96z" fill="#ff7a3d"/>
<rect x="166" y="84" width="30" height="76" rx="15" fill="#0f3d44"/><rect x="316" y="84" width="30" height="76" rx="15" fill="#0f3d44"/>
<path d="M214 384V240h96M214 308h74" fill="none" stroke="#0e8a8f" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
</svg></template>
<template id="B"><!-- B · calendario con persona e la F in alto -->
<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="gB" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2cc4b4"/><stop offset="1" stop-color="#0b7d84"/></linearGradient></defs>
<rect width="512" height="512" rx="114" fill="url(#gB)"/>
<rect x="96" y="120" width="320" height="304" rx="46" fill="#fff"/>
<path d="M96 166a46 46 0 0 1 46-46h228a46 46 0 0 1 46 46v40H96z" fill="#ff7a3d"/>
<rect x="150" y="84" width="30" height="76" rx="15" fill="#0f3d44"/><rect x="332" y="84" width="30" height="76" rx="15" fill="#0f3d44"/>
<path d="M240 192v-46h34M240 168h26" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="256" cy="256" r="27" fill="#0e8a8f"/>
<path d="M176 274 Q256 346 336 274" fill="none" stroke="#0e8a8f" stroke-width="26" stroke-linecap="round"/>
<path d="M256 306 L256 346" stroke="#0e8a8f" stroke-width="28" stroke-linecap="round"/>
<path d="M256 346 L216 394 M256 346 L296 394" stroke="#0e8a8f" stroke-width="26" stroke-linecap="round" fill="none"/>
</svg></template>
<script>
const D = [['A', 'Calendario con la F', 'La F di FisioAgenda al centro del calendario: semplice e ben leggibile anche piccola.'],
           ['B', 'Calendario con persona e F', 'Resta la persona in movimento; la F è nella fascia arancione in alto.']];
document.getElementById('row').innerHTML = D.map(([n, t, d]) => { const svg = document.getElementById(n).innerHTML;
  return '<div class="card"><span class="num">' + n + '</span><div class="big">' + svg + '</div><div class="name">' + t + '</div><div class="desc">' + d + '</div>' +
    '<div class="home"><i></i><i></i><div class="app">' + svg + '<span>FisioAgenda</span></div><i></i></div><div class="tab"><span>' + svg + 'FisioAgenda</span></div></div>'; }).join('');
</script></body></html>
